name: Validation

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "Mohammed/**"

permissions:
  contents: read

jobs:
  fast-validation:
    name: Fast validation
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Workspace/Project/frontend/workbench/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repository boundary guard
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Workspace/Project/scripts/check-repository-boundaries.ps1

      - name: Secret pattern scan
        shell: pwsh
        run: |
          $patterns = @(
            'sk-[a-zA-Z0-9]{20,}',
            'sk_live_[a-zA-Z0-9]+',
            'sk_test_[a-zA-Z0-9]+',
            'ghp_[a-zA-Z0-9]{36}',
            'gho_[a-zA-Z0-9]{36}',
            'glpat-[a-zA-Z0-9_-]+',
            'AKIA[A-Z0-9]{16}',
            'xox[baprs]-[a-zA-Z0-9-]+',
            ('-----BEGIN.*' + 'PRIVATE' + ' KEY'),
            'eyJ[a-zA-Z0-9_-]+\.eyJ[a-zA-Z0-9_-]+\.'
          )
          $files = git ls-files AGENTS.md README.md .planning Workspace/README.md Workspace/Project
          $findings = @()
          foreach ($pattern in $patterns) {
            foreach ($file in $files) {
              $matches = Select-String -Path $file -Pattern $pattern -ErrorAction SilentlyContinue
              foreach ($match in $matches) {
                $findings += "{0}:{1}" -f $match.Path, $match.LineNumber
              }
            }
          }
          if ($findings.Count -gt 0) {
            $findings | Sort-Object -Unique | ForEach-Object { Write-Host $_ }
            throw "Potential secret pattern detected."
          }
          Write-Host "Secret pattern scan passed."

      - name: Backend restore
        shell: pwsh
        working-directory: Workspace/Project/backend
        run: dotnet restore Backend.sln -p:MSBuildEnableWorkloadResolver=false /m:1

      - name: Backend build
        shell: pwsh
        working-directory: Workspace/Project/backend
        run: dotnet build Backend.sln -c Debug --no-restore -p:MSBuildEnableWorkloadResolver=false /m:1

      - name: Backend tests
        shell: pwsh
        working-directory: Workspace/Project/backend
        run: dotnet test tests/Backend.Tests/Backend.Tests.csproj -c Debug --no-build -p:MSBuildEnableWorkloadResolver=false

      - name: Frontend install
        shell: pwsh
        working-directory: Workspace/Project/frontend/workbench
        run: npm ci

      - name: Frontend scope check
        shell: pwsh
        working-directory: Workspace/Project/frontend/workbench
        run: npm run scope:check

      - name: Frontend lint
        shell: pwsh
        working-directory: Workspace/Project/frontend/workbench
        run: npm run lint

      - name: Frontend typecheck
        shell: pwsh
        working-directory: Workspace/Project/frontend/workbench
        run: npm run typecheck

      - name: Frontend unit tests
        shell: pwsh
        working-directory: Workspace/Project/frontend/workbench
        run: npm run test:run

      - name: AI sidecar install
        shell: pwsh
        working-directory: Workspace/Project/ai/service
        run: python -m pip install -e ".[dev]" -c requirements.lock.txt

      - name: AI sidecar tests
        shell: pwsh
        working-directory: Workspace/Project/ai/service
        run: pytest
