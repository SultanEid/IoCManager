policy_version: cti-policy-v1
hard_guards:
  no_auto_publish: true
  no_global_first_deploy: true
  no_irreversible_action_when_uncertain: true
  critical_asset_block_or_suppress_requires: lead

thresholds:
  uncertainty_high: 0.35
  blast_radius_high: 0.70
  evidence_conflict_high: 0.50
  maliciousness_block_min: 0.85
  deployability_canary_min: 0.60
  actionability_min: 0.55
  decay_stale: 0.75

actions:
  abstain_when:
    - uncertainty >= uncertainty_high
    - evidence_conflict >= evidence_conflict_high
  request_more_evidence_when:
    - uncertainty >= uncertainty_high
    - missing_evidence_hints_count > 0
  deploy_shadow_when:
    - actionability >= actionability_min
    - deployability < deployability_canary_min
  deploy_canary_when:
    - actionability >= actionability_min
    - deployability >= deployability_canary_min
    - blast_radius < blast_radius_high
  promote_when:
    - rollout_mode == canary
    - canary_gate_passed == true
    - approval_received == true
  block_candidate_when:
    - maliciousness >= maliciousness_block_min
    - uncertainty < uncertainty_high
    - blast_radius < blast_radius_high
    - approval_tier >= lead
  suppress_temporarily_when:
    - maliciousness < 0.40
    - predicted_noise >= 0.70
    - critical_asset == false
  escalate_when:
    - blast_radius >= blast_radius_high
    - strategic_value >= 0.70

promotion_gates:
  offline:
    precision_at_20_min: 0.72
    precision_at_20_uplift_vs_baseline_min: 0.08
    recall_at_100_non_regression_max_drop: 0.02
    ece_max: 0.06
    unsafe_recommendation_rate_max: 0.01
  shadow:
    days: 14
    override_rate_max: 0.25
    explanation_completeness_min: 0.95
    critical_policy_violations_max: 0
  canary:
    days: 7
    scope_percent: 10
    fp_delta_max: 0.10
    rollback_trigger:
      fp_delta_gt: 0.15
      sustained_hours: 2
    analyst_acceptance_min: 0.65
