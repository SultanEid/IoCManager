[project]
name = "ioc-ingestion-sidecar"
version = "0.1.0"
description = "IoC Manager ingestion sidecar with deferred compatibility endpoints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0"
]

[tool.setuptools.packages.find]
include = ["cti_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
